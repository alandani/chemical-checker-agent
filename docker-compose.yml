services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chem
      POSTGRES_PASSWORD: chem
      POSTGRES_DB: chemchecker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chem -d chemchecker"]
      interval: 5s
      retries: 10

  seed:
    build:
      context: .
      args:
        WITH_BROWSER: ${WITH_BROWSER:-true}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://chem:chem@db:5432/chemchecker
    command: python -m scripts.seed_demo
    depends_on:
      db:
        condition: service_healthy

  # One-off: downloads the public AiZynthFinder models + stock (several GB) into the volume.
  aizynth-init:
    build:
      context: .
      args:
        WITH_BROWSER: ${WITH_BROWSER:-true}
    command: >
      sh -c "[ -f /app/data/aizynth/config.yml ] && echo 'AiZynthFinder data already present' ||
             download_public_data /app/data/aizynth"
    volumes:
      - aizynth:/app/data/aizynth

  app:
    build:
      context: .
      args:
        WITH_BROWSER: ${WITH_BROWSER:-true}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://chem:chem@db:5432/chemchecker
      AIZYNTH_CONFIG: /app/data/aizynth/config.yml
    ports:
      - "8000:8000"
    volumes:
      - aizynth:/app/data/aizynth
    depends_on:
      seed:
        condition: service_completed_successfully
      aizynth-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      args:
        WITH_BROWSER: ${WITH_BROWSER:-true}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://chem:chem@db:5432/chemchecker
    command: python -m worker.scheduler
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
  aizynth:

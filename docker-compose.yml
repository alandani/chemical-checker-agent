services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chem
      POSTGRES_PASSWORD: chem
      POSTGRES_DB: chemchecker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chem -d chemchecker"]
      interval: 5s
      retries: 10

  seed:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://chem:chem@db:5432/chemchecker
    command: python -m scripts.seed_demo
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://chem:chem@db:5432/chemchecker
    ports:
      - "8501:8501"
    depends_on:
      seed:
        condition: service_completed_successfully

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://chem:chem@db:5432/chemchecker
    command: python -m worker.scheduler
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
